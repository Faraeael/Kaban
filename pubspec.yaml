name: finance_tracker
description: Privacy-first finance & debt tracker with AI coach and Android notification auto-capture.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.2
  http: ^1.2.2
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  flutter_svg: ^2.0.10+1
  file_picker: ^12.1.3
  flutter_markdown: ^0.7.7+1
  workmanager: ^0.10.9
  share_plus: ^13.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/icons/